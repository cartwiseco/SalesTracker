<!doctype html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Cart Wise Co: Lead Tracker</title>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400..800&display=swap">
<style>
:root{--bg:#f6f5fb;--card:#fff;--ink:#1f1d3d;--mut:#625f82;--line:#e4e2f0;--soft:#f1f0f8;--brand:#3d3aa8;--brandh:#2b2980;--gold:#f0a81c;--chip:#e6e4f3;--bad:#c4283f;--warn:#9a5b00;--good:#1f8a54;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:14.5px/1.5 "Bricolage Grotesque","Segoe UI",system-ui,sans-serif;font-optical-sizing:auto}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--brand);outline-offset:2px}
.app{display:flex;min-height:100vh}
aside{width:224px;flex:none;background:var(--card);border-right:1px solid var(--line);padding:20px 12px;position:sticky;top:0;height:100vh;align-self:flex-start}
.logo{display:flex;align-items:center;gap:10px;font-weight:750;font-size:17px;letter-spacing:-.01em;color:var(--ink);padding:2px 8px 22px}
.logo svg{width:34px;height:34px;flex:none}
aside button{display:flex;align-items:center;gap:11px;width:100%;border:0;background:none;color:var(--mut);padding:10px 12px;border-radius:12px;cursor:pointer;text-align:left;font-weight:560;margin-bottom:2px;position:relative}
aside button:hover{background:var(--soft);color:var(--ink)}
aside button.on{background:#ecebfb;color:var(--brand);font-weight:700}
aside button.on::before{content:"";position:absolute;left:-12px;top:9px;bottom:9px;width:4px;border-radius:0 4px 4px 0;background:var(--gold)}
aside svg.i{width:18px;height:18px;flex:none}
main{flex:1;min-width:0}
.gh{display:flex;gap:10px;align-items:center;padding:16px 28px 0}
.gh input{flex:1;max-width:460px;border:1px solid var(--line);background:var(--card);border-radius:999px;padding:10px 18px}
.gh .sp{flex:1}
.btn{border:1px solid var(--line);background:var(--card);color:var(--brand);border-radius:10px;padding:8px 16px;cursor:pointer;font-weight:650}
.btn:hover{background:#ecebfb;border-color:#cfcdf0}
.btn.pri{background:var(--brand);border-color:var(--brand);color:#fff}.btn.pri:hover{background:var(--brandh)}
.btn.sm{padding:4px 11px;font-size:12.5px;border-radius:8px}.btn.neg{color:var(--bad)}
#view{padding:22px 28px 48px;max-width:1280px}
h1{font-size:27px;line-height:1.15;letter-spacing:-.022em;font-weight:760;margin:0 0 4px}
h2{font-size:15.5px;font-weight:700;margin:0 0 12px}
.sub{color:var(--mut);margin:0 0 16px}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:18px 20px}
.t-blue{background:#e2f0fa;border-color:#c5def2}.t-amber{background:#fdf1d1;border-color:#f3dea0}.t-green{background:#e1f3e8;border-color:#bfe3cd}.t-red{background:#fbe5ea;border-color:#f3c3cd}.t-purple{background:#ecebfb;border-color:#d3d1f3}.t-teal{background:#def3f1;border-color:#b9e3df}.t-grey{background:#efeef5;border-color:#dddbea}
.plan{background:var(--brand);border-color:var(--brand);color:#fff;border-radius:22px;padding:24px 28px}
.plan h2{font-size:21px;letter-spacing:-.015em;color:#fff}.plan .sub{color:#cfcdf3}
.pt{height:9px;border-radius:9px;background:rgba(255,255,255,.22);margin:7px 0}.pf{height:100%;border-radius:9px;background:var(--gold)}.pf.done{background:#7ce0a8}
.plan .btn.pri{background:var(--gold);border-color:var(--gold);color:var(--ink)}.plan .btn.pri:hover{background:#ffbd3d}
.g{display:grid;gap:16px;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));margin-bottom:16px}
.kpis{display:grid;gap:16px;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));margin-bottom:16px}
.kpi small{color:var(--mut);display:block}.kpi b{font-size:30px;font-weight:760;letter-spacing:-.02em;display:block;margin-top:2px}
.badge{display:inline-block;padding:3px 10px;border-radius:999px;font-size:12px;font-weight:650;color:var(--c);background:var(--card);background:color-mix(in srgb,var(--c) 13%,#fff);white-space:nowrap}
.tag{display:inline-block;padding:2px 9px;border-radius:999px;font-size:11.5px;font-weight:700;background:var(--chip)}
.tag.bad{background:var(--bad);color:#fff}.tag.warn{background:var(--gold);color:var(--ink)}.tag.ok{background:var(--good);color:#fff}
.legend{display:flex;gap:6px;flex-wrap:wrap;margin:0 0 14px}
.legend button{border:1px solid var(--line);background:var(--card);border-radius:999px;padding:5px 13px;cursor:pointer;display:flex;gap:6px;align-items:center;font-size:12.5px;font-weight:550}
.legend button.on{border-color:var(--brand);background:#ecebfb;color:var(--brand);font-weight:700}
.dot{width:10px;height:10px;border-radius:50%;background:var(--c);flex:none}
.tw{overflow-x:auto}table{border-collapse:collapse;width:100%}
th{font-size:12.5px;font-weight:650;color:var(--mut);text-align:left;padding:12px 14px;border-bottom:2px solid var(--line)}
td{padding:12px 14px;border-bottom:1px solid var(--line);vertical-align:top}
tr.r{cursor:pointer}tr.r:hover td{background:#f6f5fd}td a{color:var(--brand);font-weight:700}
.t{display:flex;align-items:center;gap:12px;padding:11px 0;border-bottom:1px solid rgba(31,29,61,.08)}.t:last-child{border:0}
.t .ic{width:32px;height:32px;border-radius:10px;background:var(--c);flex:none;display:grid;place-items:center;color:#fff;font-weight:700;font-size:13px}
.t .x{flex:1;min-width:0}.t .x b{display:block}.t .x span{color:var(--mut);font-size:12.5px}.t .a{display:flex;gap:6px}
.empty{padding:20px;text-align:center;color:var(--mut)}
.board{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:12px;align-items:start}
.lane{min-width:0;background:color-mix(in srgb,var(--c) 7%,#fff);border:1px solid color-mix(in srgb,var(--c) 24%,#fff);border-radius:16px;padding:10px}
.lane h3{margin:4px 6px 10px;font-size:13.5px;display:flex;justify-content:space-between}.lane h3 span{color:var(--mut);font-weight:500}
.kc{background:#fff;border:1px solid var(--line);border-left:4px solid var(--c);border-radius:10px;padding:10px 12px;margin-bottom:8px;cursor:grab}
.kc:hover{box-shadow:0 4px 14px rgba(31,29,61,.14)}.kc small{color:var(--mut);display:block}
.br{display:grid;grid-template-columns:120px 1fr 74px;gap:10px;align-items:center;margin:8px 0}
.br i{display:block;height:12px;background:rgba(31,29,61,.08);border-radius:12px;overflow:hidden}.br s{display:block;height:100%;background:var(--c,var(--brand))}.br b{text-align:right}
.kv{display:flex;justify-content:space-between;padding:9px 0;border-bottom:1px solid rgba(31,29,61,.08)}.kv:last-child{border:0}
.cols{display:flex;align-items:flex-end;gap:10px;height:140px}.cols div{flex:1;text-align:center;font-size:12px;color:var(--mut)}.cols i{display:block;background:var(--brand);border-radius:6px 6px 0 0;margin-bottom:4px;min-height:3px}
.set{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:14px}
label{display:block;font-size:12.5px;color:var(--mut);margin-bottom:4px;font-weight:550}
input,select,textarea{border:1px solid var(--line);background:#fff;border-radius:10px;padding:9px 12px;width:100%}
#modal{display:none;position:fixed;inset:0;z-index:40;background:rgba(31,29,61,.5);overflow:auto;padding:20px 14px;padding-top:calc(20px + env(safe-area-inset-top,0px));padding-bottom:calc(20px + env(safe-area-inset-bottom,0px))}
.rec{max-width:900px;margin:0 auto;background:var(--card);border-radius:22px;overflow:hidden;animation:up .2s ease-out}
@keyframes up{from{transform:translateY(18px);opacity:0}}@media (prefers-reduced-motion:reduce){.rec{animation:none}}
.rh{display:flex;gap:14px;align-items:center;padding:20px 24px;border-bottom:1px solid var(--line);flex-wrap:wrap;background:#f6f5fd}
.rh .big{width:46px;height:46px;border-radius:14px;background:var(--c);color:#fff;display:grid;place-items:center;font-weight:700;font-size:19px}
.rh small{color:var(--mut);display:block}.rh h1{margin:0}.rh .sp{flex:1}
.pathw{padding:16px 24px 4px;background:#fff;border-bottom:1px solid var(--line);overflow-x:auto}
.path{display:flex;gap:3px;list-style:none;margin:0 0 12px;padding:0;flex-wrap:wrap}
.path li{flex:1 1 84px;text-align:center;padding:8px 4px 8px 15px;font-size:12px;font-weight:650;background:var(--chip);color:var(--mut);cursor:pointer;clip-path:polygon(0 0,calc(100% - 11px) 0,100% 50%,calc(100% - 11px) 100%,0 100%,11px 50%)}
.path li:first-child{clip-path:polygon(0 0,calc(100% - 11px) 0,100% 50%,calc(100% - 11px) 100%,0 100%);padding-left:10px}
.path li.on{background:var(--c);color:#fff}.path li.cur{box-shadow:inset 0 -3px rgba(0,0,0,.25)}
.path li.lost{flex:.7;background:var(--card);color:var(--bad);border:1px solid var(--bad);clip-path:none;border-radius:8px;margin-left:6px}.path li.lost.on{background:var(--bad);color:#fff}
.rb{padding:6px 24px 24px}
.sec{background:var(--soft);margin:18px -24px 14px;padding:8px 24px;font-size:13px;font-weight:700;color:var(--brand)}
.fg{display:grid;gap:14px;grid-template-columns:repeat(auto-fit,minmax(200px,1fr))}.fg .w{grid-column:1/-1}
.warnbox{background:#fdf1d1;border-left:4px solid var(--gold);padding:10px 14px;border-radius:10px;margin:14px 0 0}
.errbox{background:#fbe5ea;border-left:4px solid var(--bad);padding:10px 14px;border-radius:10px;margin-top:14px;color:var(--bad);font-weight:600}
.rf{display:flex;justify-content:flex-end;gap:8px;padding:14px 24px;border-top:1px solid var(--line);background:#f6f5fd}
textarea.draft{min-height:150px}
@media (max-width:1180px){.tw th:nth-child(8),.tw td:nth-child(8){display:none}}@media (max-width:980px){.tw th:nth-child(1),.tw td:nth-child(1),.tw th:nth-child(4),.tw td:nth-child(4){display:none}}@media (max-width:720px){.tw th:nth-child(3),.tw td:nth-child(3),.tw th:nth-child(7),.tw td:nth-child(7){display:none}}
@media (max-width:820px){.app{flex-direction:column}aside{width:auto;height:auto;position:static;display:flex;gap:4px;flex-wrap:wrap;overflow:visible;padding:8px;border-right:0;border-bottom:1px solid var(--line)}.logo{padding:4px 10px 4px 4px}aside button{width:auto;white-space:nowrap;margin:0}aside button.on::before{display:none}aside button.on{box-shadow:inset 0 -3px var(--gold)}#view,.gh{padding-left:14px;padding-right:14px}h1{font-size:23px}.plan{padding:20px}}
</style>
</head>
<body>
<div class="app">
<aside>
  <div class="logo"><svg viewBox="0 0 32 32" fill="none"><rect width="32" height="32" rx="10" fill="#3d3aa8"/><path d="M7 9h3l2.4 10h9.2L24 12H11.5" stroke="#fff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/><circle cx="13" cy="23" r="1.9" fill="#f0a81c"/><circle cx="21" cy="23" r="1.9" fill="#f0a81c"/></svg>Cart Wise Co</div>
  <div id="nav"></div>
</aside>
<main>
  <div class="gh"><input id="gs" placeholder="Search leads by brand, contact, handle or link" oninput="gsearch(this.value)"><span class="sp"></span><button class="btn" onclick="openImport()">Import</button><button class="btn" onclick="exportCsv()">Export</button><button class="btn pri" onclick="edit()">New lead</button></div>
  <div id="view"></div>
  <p class="sub" id="where" style="padding:0 22px 24px"></p>
</main>
</div>
<div id="modal"><div class="rec" id="rec"></div></div>

<script>
var STAGES=['New Lead','Message Sent','Replied','Call Booked','Quote Sent','Won','Lost'];
var SC={'New Lead':'#6b7a90','Message Sent':'#0176d3','Replied':'#06a59a','Call Booked':'#7f5bd6','Quote Sent':'#fe9339','Won':'#2e844a','Lost':'#ba0517'};
var OPT={
 category:['Kids & Toys','Home & Lifestyle','Fashion & Accessories','Beauty & Wellness','Food & D2C','Other'],
 source:['Meta Ad Library','Instagram','Google','Directory','Referral','LinkedIn','Other'],
 leadType:['Running ads','Weak existing store','No store yet'],
 platform:['Shopify','WooCommerce','Custom','Wix / Other','None (no store)','Unknown'],
 route:['WhatsApp','Instagram DM','Email','LinkedIn','Phone call'],
 budget:['Unknown','Under ₹40,000','₹40,000 to ₹70,000','₹70,000 to ₹1,50,000','Above ₹1,50,000'],
 service:['New store build','Store redesign','Fixes and speed work','Ongoing store management','Other'],
 dealType:['One-time project','Monthly retainer'],
 lostReason:['No reply after follow-ups','Price too high','Chose someone else','Already has a good store','Bad timing','Not a fit','Other'],
 yn:['No','Yes']};
var GAPS=[1,3,7,14,21];
var leads={},settings={goal:300000,win:30,perDay:15,days:5},tab='home',col=null,ready=false,sf='',q='',more={};

function iso(d){return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}
function today(){return iso(new Date())}
function addDays(s,n){var d=new Date(s+'T00:00:00');d.setDate(d.getDate()+n);return iso(d)}
function gap(a,b){return Math.round((new Date(a+'T00:00:00')-new Date(b+'T00:00:00'))/864e5)}
function inr(n){return '₹'+Number(n||0).toLocaleString('en-IN')}
function fmt(s){return s?new Date(s+'T00:00:00').toLocaleDateString('en-IN',{day:'2-digit',month:'short',year:'2-digit'}):''}
function esc(s){return String(s==null?'':s).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}
function $(i){return document.getElementById(i)}
function list(){return Object.values(leads).sort(function(a,b){return (a.n||0)-(b.n||0)})}
function badge(s){return '<span class="badge" style="--c:'+SC[s]+'">'+s+'</span>'}

/* rules, same as the spreadsheet */
function due(l){if(l.stage!=='Message Sent'||!l.firstMsg)return '';var n=+l.fu||0;var G=gapList();return n>=G.length?'done':addDays(l.firstMsg,G[n])}
function rel(d){var t=today();return d<t?'Overdue':d===t?'Due today':'Upcoming'}
function fuStatus(l){var d=due(l);return !d?'':d==='done'?'Close or Lost':rel(d)}
function naStatus(l){if(['Replied','Call Booked','Quote Sent'].indexOf(l.stage)<0)return '';return l.nextAction?rel(l.nextAction):'Set date'}
function reach(l){if(l.stage==='Won')return 5;if(l.stage==='Quote Sent'||(l.stage==='Lost'&&l.value))return 4;if(l.stage==='Call Booked'||l.callDate)return 3;if(l.stage==='Replied'||l.replyDate)return 2;return l.firstMsg?1:0}
function same(a,b){return a&&b&&String(a).trim().toLowerCase()===String(b).trim().toLowerCase()}
function checks(l){var o=Object.values(leads).filter(function(x){return x.id!==l.id}),out=[],s=l.stage;
  if(o.some(function(x){return same(x.brand,l.brand)}))out.push('Duplicate brand');
  if(o.some(function(x){return same(x.link,l.link)}))out.push('Duplicate link');
  if(o.some(function(x){return same(x.handle,l.handle)}))out.push('Duplicate contact');
  if(s==='New Lead'&&l.firstMsg)out.push('Stage still New Lead');
  if(s!=='New Lead'&&s!=='Lost'&&!l.firstMsg)out.push('Add first message date');
  if(['Replied','Call Booked','Quote Sent','Won'].indexOf(s)>=0&&!l.replyDate)out.push('Add reply date');
  if((s==='Quote Sent'||s==='Won')&&!l.value)out.push('Add deal value');
  if(s==='Won'&&!l.wonDate)out.push('Add won date');
  if(s==='Lost'&&!l.lostReason)out.push('Add lost reason');
  return out}
var TPLD=['{hi} I was looking at {brand} and noticed {obs}. I help online brands fix issues like this so more visitors check out. Could I send you a free 10-point audit of your store?',
'{hi} just checking you saw my last message about {brand}. Happy to share what I found, no strings attached.',
'{hi} I put together a free 10-point audit for {brand}, starting with {obs}. Want me to send it over?',
'{hi} here is a live store in your space that we improved. I can show you what changed and what it did for their orders.',
'{hi} one quick tip for {brand}: fast pages and a simple checkout lift orders more than most design changes. Glad to point out where yours can improve.',
'{hi} I will stop pinging you here. If store improvements come up later, I am a message away. Wishing {brand} a great season.'];
async function aiDraft(id){var l=leads[id],b=$('aib'),n=l.stage==='New Lead'?-1:(+l.fu||0),G=gapList(),kind=n<0?'first message':(n>=G.length-1?'final polite follow-up that closes the loop with no pressure':'follow-up number '+(n+1)),sm=null,em=l.route==='Email';
  try{sm=window.claude&&await claude.use('sample')}catch(e){}
  if(!sm){b.textContent='AI not available here';return}
  b.disabled=true;b.textContent='Writing...';
  var hist=(l.log||[]).slice(-5).map(function(e){return fmt(e.t)+': '+e.x}).join('\n'),
  pr=['You write outreach messages for Cart Wise Co, a one-person service that builds and fixes online stores for brands in India.','Write one '+kind+' to '+(l.contact||'the owner')+' at '+l.brand+'.','Tone and language: '+$('tn').value+'.','Channel: '+(l.route||'chat')+(em?' (email body only, up to 90 words)':' (up to 60 words)')+'.','Lead details: category '+(l.category||'unknown')+'; platform '+(l.platform||'unknown')+'; store link '+(l.link||'none')+'.','What the sender noticed about the store: '+(l.observation||'nothing noted')+'.','Internal notes, do not quote: '+(l.notes||'none')+'.','Recent activity:\n'+(hist||'none'),'Rules: use only the facts above and never invent details about the store. No flattery, no fake urgency, no emojis unless the tone is casual. For a first message offer a free 10-point audit. End with one soft question. Reference message for the offer and style:\n'+draft(l),'Output only the message text with no subject line and no quotes.'].join('\n\n');
  try{var r=await sm(pr,{modelTier:'quick',cache:false});if($('dt')){$('dt').value=r.text.trim();b.textContent='Write again'}}catch(e){b.textContent=e&&e.code==='not_granted'?'Permission needed':'Try again'}
  b.disabled=false}
async function gmailDraft(id){var l=leads[id],b=$('gmb'),to=(l.handle||'').trim(),mcp=null;
  try{mcp=window.claude&&await claude.use('mcp')}catch(e){}
  if(!mcp){b.textContent='Gmail is not available here';return}
  b.disabled=true;b.textContent='Creating draft...';
  try{var r=await mcp.callTool('Gmail','create_draft',{to:[to],subject:'Quick idea for '+l.brand,body:$('dt').value,includeSignature:true}),u=r.payload&&r.payload.viewUrl;
    try{var c=Object.assign({},leads[id]);c.log=(c.log||[]).concat([{t:today(),x:'Gmail draft created'}]);saveLead(c)}catch(e2){}
    b.disabled=false;if(u){window._gmu=u;b.textContent='Draft created. Open in Gmail';b.onclick=function(){window.open(window._gmu,'_blank')}}else b.textContent='Draft created in Gmail'}
  catch(e){var k=e&&e.code;b.disabled=false;b.textContent=k==='server_not_connected'?'Connect Gmail in Settings, Connectors':k==='needs_reauth'?'Reconnect Gmail in Settings, Connectors':(k==='approval_required'||k==='not_in_manifest'||k==='not_granted'||k==='consent_required')?'Gmail needs your permission. Click to ask again':k==='tool_error'?'Gmail refused the draft':'Could not create the draft'}}
function vFind(){var added=list().filter(function(l){return l.added===today()&&(l.log||[]).some(function(e){return e.x==='Found via lead finder'})}).length,
  card=function(t,w,k,btn,steps){return '<div class="card '+({ads:'t-blue',google:'t-amber',insta:'t-green'}[k])+'"><h2>'+t+'</h2><div class="sub" style="margin:0 0 10px">'+w+'</div><button class="btn pri" onclick="openFind(\''+k+'\')">'+btn+'</button><ol style="margin:12px 0 0;padding-left:18px;color:var(--mut);font-size:13px;line-height:1.6">'+steps.map(function(x){return '<li>'+x+'</li>'}).join('')+'</ol></div>'};
  return '<h1>Find leads</h1><p class="sub">Type a product keyword, run one of the three searches, and save good brands straight into your leads. A few well-checked leads with one specific observation beat a long list.</p>'+
  '<div class="card t-grey" style="margin-bottom:12px"><div style="display:flex;gap:10px;flex-wrap:wrap"><div><label>Product keyword</label><input id="fk" value="'+esc(window._fk||'')+'" placeholder="for example handloom sarees" style="width:240px"></div><div><label>Category for saved leads</label><select id="fc">'+OPT.category.map(function(o){return '<option'+(o===(window._fcat||'Fashion & Accessories')?' selected':'')+'>'+esc(o)+'</option>'}).join('')+'</select></div></div></div>'+
  '<div class="g">'+
  card('Running ads','Brands paying for traffic, so they have a budget.','ads','Open Meta Ad Library (India)',['Open an ad and click through to the store.','Check mobile speed, product pages and checkout.','Note one specific problem you could fix.'])+
